server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the ASP.NET container ("api" is its Docker Compose service name).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so browsers can cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths like /my-bookings fall back to the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
