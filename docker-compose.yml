services:
  db:
    image: postgres:17-alpine
    container_name: hotelbooking-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotelbooking}
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: hotelbooking-api
    environment:
      # Double underscores map to nested config keys, e.g. ConnectionStrings:Default.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-hotelbooking};Username=${POSTGRES_USER:-hotel};Password=${POSTGRES_PASSWORD:-hotel_dev_password}"
      Database__InitializeOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-demo-signing-key-change-me-0123456789}
      Seed__StaffEmail: ${STAFF_EMAIL:-staff@hotel.local}
      Seed__StaffPassword: ${STAFF_PASSWORD:-Staff123!}
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim ASP.NET image has no curl, so call /health with bash's built-in TCP support.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q healthy <&3"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./frontend
    container_name: hotelbooking-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
